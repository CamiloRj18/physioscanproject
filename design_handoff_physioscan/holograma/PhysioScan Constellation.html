<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PhysioScan — Constellation Net</title>
<style>
  :root{
    --bg:#020813; --cyan:#79DBFF; --ice:#B4F8FF; --ring:#19AAFF;
    --cyan-dim:rgba(121,219,255,.55); --cyan-faint:rgba(121,219,255,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--cyan); overflow:hidden;
    font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10;}
  .corner{position:absolute;width:44px;height:44px;border:1.5px solid var(--cyan-dim);}
  .corner.tl{top:22px;left:22px;border-right:none;border-bottom:none;}
  .corner.tr{top:22px;right:22px;border-left:none;border-bottom:none;}
  .corner.bl{bottom:22px;left:22px;border-right:none;border-top:none;}
  .corner.br{bottom:22px;right:22px;border-left:none;border-top:none;}
  .brand{position:absolute;top:30px;left:42px;}
  .brand h1{font-size:15px;letter-spacing:.42em;font-weight:600;text-shadow:0 0 14px rgba(121,219,255,.55);}
  .brand .sub{margin-top:7px;font-size:10px;letter-spacing:.26em;color:var(--cyan-dim);}
  .tick{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ice);
    box-shadow:0 0 8px var(--ice);margin-right:8px;vertical-align:middle;animation:blink 1.8s steps(1,end) infinite;}
  @keyframes blink{0%,70%{opacity:1}71%,100%{opacity:.25}}
  .readouts{position:absolute;top:30px;right:42px;text-align:right;}
  .readouts .row{font-size:10px;letter-spacing:.16em;color:var(--cyan-dim);margin-bottom:6px;}
  .readouts .row b{color:var(--cyan);font-weight:600;}
  .footer{position:absolute;bottom:32px;left:42px;font-size:10px;letter-spacing:.24em;color:var(--cyan-dim);}
  .footer .key{color:var(--cyan);}
  .fx{position:fixed;inset:0;pointer-events:none;z-index:9;}
  .fx.vignette{background:radial-gradient(ellipse at center,transparent 50%,rgba(2,8,19,.88) 100%);}
  .fx.scan{background:repeating-linear-gradient(to bottom,rgba(121,219,255,.03) 0px,rgba(121,219,255,.03) 1px,transparent 1px,transparent 3px);mix-blend-mode:screen;opacity:.5;}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;
    font-size:11px;letter-spacing:.3em;color:var(--cyan-dim);background:var(--bg);}
  @media (prefers-reduced-motion:reduce){.tick{animation:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="fx vignette"></div>
<div class="fx scan"></div>
<div class="hud">
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="brand">
    <h1>PHYSIOSCAN</h1>
    <div class="sub"><span class="tick"></span>CONSTELLATION NET // SUBJECT&nbsp;01</div>
  </div>
  <div class="readouts">
    <div class="row">NODES&nbsp;&nbsp;<b id="r-pts">—</b></div>
    <div class="row">LINKS&nbsp;&nbsp;<b id="r-edges">—</b></div>
    <div class="row">FACES&nbsp;&nbsp;<b>0</b></div>
    <div class="row">SCAN&nbsp;&nbsp;<b>ACTIVE</b></div>
  </div>
  <div class="footer"><span class="key">DRAG</span> ROTATE &nbsp;·&nbsp; <span class="key">SCROLL</span> ZOOM</div>
</div>
<div id="loading">ASSEMBLING NETWORK…</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="constellation.js"></script>
</body>
</html>
