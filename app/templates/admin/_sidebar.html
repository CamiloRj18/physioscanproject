<aside class="sidebar" aria-label="Navegación de administración">
  <div class="s-brand">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-logo"></use></svg>
    Physio<b>Scan</b>
  </div>
  <div class="s-group">Administración</div>
  <a class="s-link{% if request.endpoint == 'admin.panel' %} active{% endif %}" href="{{ url_for('admin.panel') }}">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-grid"></use></svg>
    Panel
  </a>
  <a class="s-link{% if request.endpoint in ('admin.usuarios', 'admin.usuario_detalle', 'admin.crear_usuario') %} active{% endif %}" href="{{ url_for('admin.usuarios') }}">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-users"></use></svg>
    Usuarios
  </a>
  <a class="s-link{% if request.endpoint in ('admin.dispositivos','admin.crear_dispositivo','admin.dispositivo_detalle') %} active{% endif %}" href="{{ url_for('admin.dispositivos') }}">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-device"></use></svg>
    Dispositivos
  </a>
  <a class="s-link{% if request.endpoint == 'admin.crear_sesion' %} active{% endif %}" href="{{ url_for('admin.crear_sesion') }}">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-ecg"></use></svg>
    Sesiones
  </a>
  <a class="s-link{% if request.endpoint == 'admin.auditoria' %} active{% endif %}" href="{{ url_for('admin.auditoria') }}">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-log"></use></svg>
    Auditoría
  </a>
</aside>
