<nav class="navbar" role="navigation" aria-label="Navegación principal">
  <div class="navbar__container">
    <a href="{{ url_for('publico.home') }}" class="navbar__brand" aria-label="PhysioScan — inicio">
      <svg class="navbar__brand-icon" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M14 2C7.373 2 2 7.373 2 14s5.373 12 12 12 12-5.373 12-12S20.627 2 14 2z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 14h2l2-5 3 10 2-7 1 2h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="navbar__brand-text">PhysioScan</span>
    </a>

    <button class="navbar__toggle" aria-controls="navbar-menu" aria-expanded="false" aria-label="Abrir menú de navegación">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18"/>
      </svg>
    </button>

    <div class="navbar__menu" id="navbar-menu">
      <ul class="navbar__nav" role="list">
        <li><a href="{{ url_for('publico.home') }}" class="navbar__link">Inicio</a></li>
      </ul>

      <div class="navbar__actions">
        {% if current_user.is_authenticated %}
          <span class="navbar__user">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            {{ current_user.primer_nombre }}
          </span>
          <form action="{{ url_for('auth.logout') }}" method="post" class="d-inline">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-ghost btn--sm">Cerrar sesión</button>
          </form>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn--sm">Ingresar</a>
          <a href="{{ url_for('auth.registro') }}" class="btn btn-primary btn--sm">Registrarse</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
