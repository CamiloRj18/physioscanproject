{% extends "base.html" %}
{% block title %}Códigos de recuperación — PhysioScan{% endblock %}
{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/page-auth.css') }}">
{% endblock %}

{% block content %}
<div class="pdf-viewer-wrap">
  <h1>Tus códigos de recuperación</h1>
  <p class="muted">Guarda este archivo antes de continuar. Cada código es de un solo uso.</p>
  <iframe class="pdf-frame"
          src="data:application/pdf;base64,{{ pdf_b64 }}"
          title="Códigos de recuperación PhysioScan">
  </iframe>
  <div class="pdf-actions">
    <a href="data:application/pdf;base64,{{ pdf_b64 }}"
       download="physioscan_codigos_recuperacion.pdf"
       class="btn btn-secondary">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-download"></use></svg>
      Descargar PDF
    </a>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-arrow-right"></use></svg>
      Continuar al login
    </a>
  </div>
</div>
{% endblock %}
